[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "archhelp-claude-plugin"
version     = "1.0.0"
description = "MCP server: scan GitHub repos and generate technical architecture diagrams"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.11"
keywords    = [
    "mcp", "claude", "github", "architecture", "diagrams",
    "mermaid", "data-flow", "erd", "devtools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "diagrams>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]

[project.scripts]
archhelp-claude-plugin = "server.main:main"

[project.urls]
Homepage      = "https://github.com/arun250492/archhelp-Claude-plugin"
Repository    = "https://github.com/arun250492/archhelp-Claude-plugin"
"Bug Tracker" = "https://github.com/arun250492/archhelp-Claude-plugin/issues"
Changelog     = "https://github.com/arun250492/archhelp-Claude-plugin/blob/main/CHANGELOG.md"

# ─── Tool configuration ────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode   = "auto"
testpaths      = ["tests"]
addopts        = "-v --tb=short --cov=server --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source  = ["server"]
omit    = ["server/__init__.py", "server/image_renderer.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def main",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "RET", "SIM"]
ignore = [
    "S101",   # assert in tests is fine
    "B008",   # function calls in default args (FastAPI style)
    "S105",   # possible hardcoded password — false positives in tests
    "S106",
    "N806",   # variable in function should be lowercase (ok in our context)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]   # relax security and naming checks in tests

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
exclude                = ["tests/"]
